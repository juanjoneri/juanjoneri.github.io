name: publish

# Reusable workflow, called from a private repo. Runs entirely inside the CALLER (private) repo:
# build → encrypt → push to site/<repo-name> on the hub. Plaintext and logs never leave the private repo.
#
# Caller example (.github/workflows/site.yml in the private repo):
#   jobs:
#     publish:
#       uses: juanjoneri/juanjoneri.github.io/.github/workflows/publish.yml@master
#       with: { build: "bash build.sh", title: "My page" }
#       secrets:
#         STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
#         HUB_DEPLOY_KEY: ${{ secrets.HUB_DEPLOY_KEY }}
#         BUILD_ENV: AIRTABLE_TOKEN=${{ secrets.AIRTABLE_TOKEN }}   # optional, build step only

on:
  workflow_call:
    inputs:
      build:
        description: Command that writes plain HTML into the dist directory
        type: string
        required: true
      dist:
        description: Output directory of the build
        type: string
        default: dist
      title:
        description: Title shown on the unlock screen (defaults to the repo name)
        type: string
        default: ""
    secrets:
      STATICRYPT_PASSWORD:
        required: true
      HUB_DEPLOY_KEY:
        required: true
      BUILD_ENV:
        description: Optional KEY=VALUE lines exported to the build step only (e.g. API tokens)
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HUB: juanjoneri/juanjoneri.github.io
      DIST: ${{ inputs.dist }}
      TITLE: ${{ inputs.title }}
      OUT: ${{ github.workspace }}/.encrypted
      TEMPLATE: ${{ github.workspace }}/.hub/assets/unlock.html
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Fetch hub tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: juanjoneri/juanjoneri.github.io
          ref: master
          path: .hub
          sparse-checkout: |
            assets
            .github/scripts

      - name: Slug
        run: echo "SLUG=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
          BUILD_CMD: ${{ inputs.build }}
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && export "$line"
          done <<< "$BUILD_ENV"
          unset BUILD_ENV
          eval "$BUILD_CMD"

      - name: Encrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: bash .hub/.github/scripts/encrypt.sh

      - name: Remove plaintext
        run: rm -rf "$DIST"

      - name: Push to hub
        env:
          HUB_DEPLOY_KEY: ${{ secrets.HUB_DEPLOY_KEY }}
        run: bash .hub/.github/scripts/push.sh
