name: publish

# Reusable workflow, called from a private repo. Runs entirely inside the CALLER (private) repo.
#   job "build": build → encrypt. Sees plaintext, the build secrets and STATICRYPT_PASSWORD. Never sees the deploy key.
#   job "push":  pushes the encrypted output to site/<repo-name> on the hub. Sees only the deploy key; runs no repo code.
# Plaintext and logs never leave the private repo.
#
# Callers pin BOTH the workflow and the tooling to the same reviewed hub commit, so a later push to the
# hub's master cannot change what runs next to their secrets:
#   jobs:
#     publish:
#       uses: juanjoneri/juanjoneri.github.io/.github/workflows/publish.yml@<sha>
#       with: { build: "python3 build.py", hub_ref: "<same sha>" }
#       secrets:
#         STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
#         HUB_DEPLOY_KEY: ${{ secrets.HUB_DEPLOY_KEY }}
#         BUILD_ENV: AIRTABLE_TOKEN=${{ secrets.AIRTABLE_TOKEN }}   # optional, build step only

on:
  workflow_call:
    inputs:
      build:
        description: Command that writes plain HTML into the dist directory
        type: string
        required: true
      dist:
        description: Output directory of the build
        type: string
        default: dist
      hub_ref:
        description: Hub commit to take scripts, template and staticrypt lockfile from (use the same SHA as in `uses:`)
        type: string
        default: master
      job:
        description: Name of the site.json job this run performs (a GitHub Actions job); recorded as ok in status.json
        type: string
        default: ""
    secrets:
      STATICRYPT_PASSWORD:
        required: true
      HUB_DEPLOY_KEY:
        required: true
      BUILD_ENV:
        description: Optional KEY=VALUE lines exported to the build step only (e.g. API tokens)
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIST: ${{ inputs.dist }}
      OUT: ${{ github.workspace }}/_encrypted
      TEMPLATE: ${{ github.workspace }}/.hub/assets/unlock.html
      STATICRYPT_BIN: ${{ github.workspace }}/.hub/.github/staticrypt/node_modules/.bin/staticrypt
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Fetch hub tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: juanjoneri/juanjoneri.github.io
          ref: ${{ inputs.hub_ref }}
          path: .hub
          persist-credentials: false
          sparse-checkout: |
            assets
            kit
            .github/scripts
            .github/staticrypt

      - name: Install staticrypt (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .hub/.github/staticrypt

      - name: Slug
        run: echo "SLUG=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
          BUILD_CMD: ${{ inputs.build }}
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && export "$line"
          done <<< "$BUILD_ENV"
          unset BUILD_ENV
          eval "$BUILD_CMD"

      - name: Status (reporting)
        env:
          JOB: ${{ inputs.job }}
        run: |
          # An Actions job that got this far succeeded: record it. Mac jobs commit their own status.json.
          if [ -n "$JOB" ] && [ -f site.json ]; then python3 .hub/kit/sitekit.py report "$JOB" --ok; fi
          # Details go INTO the pages before encryption; only a failed/ok_until summary is published.
          if [ -f status.json ]; then python3 .hub/.github/scripts/status_publish.py status.json "$DIST" "$RUNNER_TEMP/public"; fi

      - name: Encrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          bash .hub/.github/scripts/encrypt.sh
          if [ -f "$RUNNER_TEMP/public/status.json" ]; then cp "$RUNNER_TEMP/public/status.json" "$OUT/status.json"; fi

      - name: Remove plaintext
        run: rm -rf "$DIST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted
          path: _encrypted
          retention-days: 1
          if-no-files-found: error

  push:
    needs: build
    runs-on: ubuntu-latest
    env:
      HUB: juanjoneri/juanjoneri.github.io
      OUT: ${{ github.workspace }}/_encrypted
    steps:
      - name: Fetch hub tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: juanjoneri/juanjoneri.github.io
          ref: ${{ inputs.hub_ref }}
          path: .hub
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: encrypted
          path: _encrypted

      - name: Slug
        run: echo "SLUG=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Push to hub
        env:
          HUB_DEPLOY_KEY: ${{ secrets.HUB_DEPLOY_KEY }}
        run: bash .hub/.github/scripts/push.sh
