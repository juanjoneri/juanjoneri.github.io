name: deploy

# Builds the whole site: public files on master + every registered site/<slug> branch (signed, encrypted pages).
# Private repos only push their site/<slug> branch (they cannot write master). That push carries a small kick.yml that
# dispatches this workflow; the schedule is a fallback. Scheduled runs deploy only when something changed.
on:
  push:
    branches: [master]
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.state.outputs.changed }}
      rejected: ${{ steps.assemble.outputs.rejected }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # no token on disk while assembling untrusted site/* branches

      - name: Anything new?
        id: state
        run: |
          { git rev-parse HEAD; git ls-remote origin 'refs/heads/site/*' | LC_ALL=C sort; } > .deploy-state
          live=$(curl -fsS --max-time 20 "https://juanjoneri.github.io/deploy-state.txt" || true)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$live" = "$(cat .deploy-state)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "nothing changed since the last deploy"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble site
        id: assemble
        if: steps.state.outputs.changed == 'true'
        run: |
          bash .github/scripts/assemble.sh
          echo "rejected=$(paste -sd ' ' .rejected)" >> "$GITHUB_OUTPUT"

      - if: steps.state.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The good sites are live by now. A rejected site is not: fail the run so GitHub emails about it.
  rejected:
    needs: [build, deploy]
    if: needs.build.outputs.rejected != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          REJECTED: ${{ needs.build.outputs.rejected }}
        run: |
          echo "::error::not published (failed a check, see the build job's log): $REJECTED"
          exit 1
