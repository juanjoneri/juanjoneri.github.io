<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RSA Tool</title>

  <link rel="stylesheet" href="../vendor/bootstrap-4.0.0.min.css">
  <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">
        <div class="row">

            <div class="col-sm">
                <h1>Enter public key from receiver.</h1>    
            </div>

        </div>

        
        <div class="row">

            <div class="col-sm">
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text">N</span>
                    </div>
                    <input id="N-value" type="text" class="form-control" placeholder="Some big number">
                </div>
            </div>

            <div class="col-sm">
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text">e</span>
                    </div>
                    <input id="e-value" type="text" class="form-control" placeholder="Some prime number">
                </div>
            </div>

        </div>

        <div class="row">

                <div class="col-sm">
                    <h2>Encrypt message for receiver.</h2>    
                </div>
    
            </div>
                  
        <div class="row">
                    
            <div class="col-sm">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text" >Text to encrypt <br> (letters and spaces)</span>
                    </div>
                    <textarea id="text-value" class="form-control" aria-label="With textarea"></textarea>
                </div>
            </div>

        </div>

        <br>

        <div class="row">
            <div class="col-sm">
                <button type="button" onclick="encrypt()" class="btn btn-primary"><i class="fas fa-lock"></i> Encrypt</button>
            </div>
        </div>

        <br>

        <div class="row">
            <div class="col-sm">
                <div class="form-group">
                    <label>Encrypted message</label>
                    <textarea class="form-control" id="output" rows="3"></textarea>
                </div>    
            </div>
        </div>

    </div>
    
    <script src="../vendor/BigInteger-1.6.26.min.js"></script>
    <script defer src="../vendor/fontawesome-5.15.4/js/all.min.js"></script>
    <script src="../vendor/jquery-3.2.1.slim.min.js"></script>
    <script src="../vendor/popper-1.12.9.min.js"></script>
    <script src="../vendor/bootstrap-4.0.0.min.js"></script>
    <script src="send.js"></script>
</body>
</html>
