<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>/*[|template_title|]*/0</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<!-- Applies to the decrypted page too (it replaces this document's content, not the document). Every page on this
     origin can read every site's remembered key, so a page may only load from this origin and may not send data out:
     no third-party scripts (CLAUDE.md rule 6), no eval, no fetch/image/form to other hosts. Inline CSS/JS stay allowed
     (pages are single HTML files). Links to other sites still work. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'" />
<meta http-equiv="cache-control" content="no-cache" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<style>
  /* dark only, pills (matches /assets/style.css; kept inline because the unlock screen must render on its own) */
  :root { color-scheme: dark; --bg:#0e0e0d; --surface:#181817; --raise:#222220; --fg:#f2f1ed; --text:#cfcdc7; --muted:#8a8984;
          --line:#2a2a28; --accent:#5b9ae6; --bad:#e8687d; --ease:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 Menlo, Consolas, "Courier New", monospace;
         display: flex; align-items: center; justify-content: center; padding: 16px; }
  .hidden { display: none !important; }
  .box { width: 100%; max-width: 360px; animation: in .25s var(--ease); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 15px; font-weight: 700; color: var(--fg); margin: 4px 0 2px; }
  .note { color: var(--muted); margin: 0 0 14px; font-size: 12px; }
  .user { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .field { position: relative; margin-bottom: 10px; }
  input[type=password], input[type=text].pw {
    width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 10px 46px 10px 16px; outline: 0;
    transition: border-color .2s var(--ease); }
  input:focus { border-color: var(--accent); }
  .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; padding: 11px;
         opacity: .5; cursor: pointer; filter: invert(1); }
  .row { display: flex; gap: 8px; align-items: center; }
  .pill { display: inline-block; line-height: 1; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px;
          background: var(--surface); color: var(--text); font: inherit; font-size: 12px; padding: 12px 14px; cursor: pointer;
          text-box: trim-both cap alphabetic; user-select: none; position: relative;
          transition: transform .12s var(--ease), background .2s var(--ease), color .2s var(--ease); }
  .pill::after { content: ""; position: absolute; inset: -6px; }
  .pill:active { transform: scale(.94); }
  @supports not (text-box: trim-both cap alphabetic) { .pill { padding: 10px 14px 8px; } }
  .remember input { position: absolute; opacity: 0; pointer-events: none; }
  .remember:has(input:checked) { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button.pill { margin-left: auto; background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
  .err { color: var(--bad); margin-top: 10px; min-height: 1.5em; font-size: 12px; }
  .shake { animation: shake .35s var(--ease); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .spin { color: var(--muted); }
  .foot { margin-top: 18px; }
  .foot a { color: var(--muted); text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="staticrypt_loading" class="spin">decrypting…</div>
<div id="staticrypt_content" class="box hidden">
  <div class="label">▍locked page</div>
  <h1>/*[|template_title|]*/0</h1>
  <p class="note">/*[|template_instructions|]*/0</p>
  <form id="staticrypt-form" action="#" method="post">
    <!-- lets iOS / password managers save one password per site (the username is the site's name) -->
    <input class="user" type="text" name="username" autocomplete="username" value="/*[|template_title|]*/0" tabindex="-1" readonly aria-hidden="true" />
    <div class="field">
      <input id="staticrypt-password" type="password" name="password" placeholder="/*[|template_placeholder|]*/0" autocomplete="current-password" autofocus />
      <img class="eye staticrypt-toggle-password-visibility" alt="/*[|template_toggle_show|]*/0" title="/*[|template_toggle_show|]*/0"
        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2'><path d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/></svg>" />
    </div>
    <div class="row">
      <label id="staticrypt-remember-label" class="pill remember hidden">
        <input id="staticrypt-remember" type="checkbox" name="remember" />/*[|template_remember|]*/0
      </label>
      <button class="pill" type="submit">/*[|template_button|]*/0</button>
    </div>
    <div id="err" class="err" role="alert"></div>
  </form>
  <div class="foot"><a class="pill" href="/">← all sites</a></div>
</div>
<script>
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const templateError = "/*[|template_error|]*/0",
    templateToggleAltShow = "/*[|template_toggle_show|]*/0",
    templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
    isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
    staticryptConfig = /*[|staticrypt_config|]*/ 0;

  // Every page shares one origin, so "remember me" keys are namespaced by the page's salt.
  // Otherwise opening one page would try (and wipe) another page's remembered key.
  const ns = staticryptConfig.staticryptSaltUniqueVariableName;
  const templateConfig = {
    rememberExpirationKey: "staticrypt_expiration_" + ns,
    rememberPassphraseKey: "staticrypt_passphrase_" + ns,
    replaceHtmlCallback: null,
    clearLocalStorageCallback: null,
  };
  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

  window.onload = async function () {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    if (!isSuccessful) {
      document.getElementById("staticrypt_loading").classList.add("hidden");
      document.getElementById("staticrypt_content").classList.remove("hidden");
      document.getElementById("staticrypt-password").focus();
      if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
    }
  };

  const eye = document.querySelector(".staticrypt-toggle-password-visibility");
  eye.addEventListener("click", function () {
    const i = document.getElementById("staticrypt-password");
    const show = i.type === "password";
    i.type = show ? "text" : "password";
    eye.style.opacity = show ? 0.9 : 0.45;
    eye.alt = eye.title = show ? templateToggleAltHide : templateToggleAltShow;
  });

  document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    const password = document.getElementById("staticrypt-password").value,
      remember = document.getElementById("staticrypt-remember").checked;
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember);
    if (!isSuccessful) {
      err.textContent = "✗ " + templateError;
      const box = document.getElementById("staticrypt_content");
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      document.getElementById("staticrypt-password").select();
    }
  });
</script>
</body>
</html>
