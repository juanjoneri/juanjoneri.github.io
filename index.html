  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {

    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .hidden { display: none !important; }
  .box { width: 100%; max-width: 380px; }
  .label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 16px; font-weight: 700; color: var(--fg); margin: 6px 0 4px; }
  .note { color: var(--muted); margin: 0 0 20px; }
  hr { border: 0; border-top: 1px dashed var(--line); margin: 0 0 20px; }
  .field { position: relative; margin-bottom: 12px; }
  input[type=password], input[type=text] {
    width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--field);
    border: 1px solid var(--line); border-radius: 3px; padding: 10px 40px 10px 12px; outline: 0;
  }
  input:focus { border-color: var(--accent); }
  .eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; opacity: .45; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .eye { filter: invert(1); } }
  label.remember { display: flex; gap: 8px; align-items: center; color: var(--muted); margin-bottom: 16px; cursor: pointer; }
  button {
    width: 100%; font: inherit; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 10px;
  }
  button:hover { background: var(--accent); color: var(--bg); }
  .err { color: var(--bad); margin-top: 12px; min-height: 1.6em; }
  .spin { color: var(--muted); }
  .foot { margin-top: 28px; color: var(--muted); font-size: 11px; }
  .foot a { color: var(--muted); }
</style>
</head>
