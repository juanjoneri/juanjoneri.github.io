<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Purchase Receipts</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<!-- Applies to the decrypted page too (it replaces this document's content, not the document). Every page on this
     origin can read every site's remembered key, so a page may only load from this origin and may not send data out:
     no third-party scripts (CLAUDE.md rule 6), no eval, no fetch/image/form to other hosts. Inline CSS/JS stay allowed
     (pages are single HTML files). Links to other sites still work. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'" />
<meta http-equiv="cache-control" content="no-cache" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

         display: flex; align-items: center; justify-content: center; padding: 16px; }
  .hidden { display: none !important; }
  .box { width: 100%; max-width: 360px; animation: in .25s var(--ease); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 15px; font-weight: 700; color: var(--fg); margin: 4px 0 2px; }
  .note { color: var(--muted); margin: 0 0 14px; font-size: 12px; }
  .user { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .field { position: relative; margin-bottom: 10px; }
  input[type=password], input[type=text].pw {
    width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 10px 46px 10px 16px; outline: 0;
    transition: border-color .2s var(--ease); }
  input:focus { border-color: var(--accent); }
  .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; padding: 11px;

  .row { display: flex; gap: 8px; align-items: center; }
  .pill { display: inline-block; line-height: 1; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px;

  .remember input { position: absolute; opacity: 0; pointer-events: none; }
  .remember:has(input:checked) { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button.pill { margin-left: auto; background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
  .err { color: var(--bad); margin-top: 10px; min-height: 1.5em; font-size: 12px; }
  .shake { animation: shake .35s var(--ease); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .spin { color: var(--muted); }
  .foot { margin-top: 18px; }

</style>
</head>
